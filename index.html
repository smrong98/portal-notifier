<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Portal Notifier</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:680px;margin:auto;padding:18px 14px 64px}h1{font-size:25px;margin:6px 0 18px}h2{font-size:16px;margin:0 0 12px}
.card{background:#fff;border-radius:18px;padding:17px;margin-bottom:13px;box-shadow:0 1px 3px #0000000f}
.row{display:flex;gap:9px;align-items:center}.dot{width:10px;height:10px;border-radius:99px;background:#9ca3af}.dot.ok{background:#10b981}.dot.bad{background:#ef4444}
.meta,.hint{font-size:12px;color:#6b7280;line-height:1.6;margin-top:8px}.error{display:none;margin-top:8px;background:#fef2f2;color:#991b1b;padding:9px;border-radius:10px;font-size:12px}
button{border:0;border-radius:12px;padding:11px 13px;background:#111827;color:#fff;font-weight:700;font-size:14px}button.secondary{background:#e5e7eb;color:#111827}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{flex:1;min-width:120px}
.field{display:block;font-size:13px;color:#4b5563;margin:10px 0}input,select{width:100%;padding:11px;margin-top:6px;border:1px solid #d1d5db;border-radius:11px;font-size:16px;background:#fff}
.check{display:flex;gap:9px;align-items:center;padding:8px 0}.check input{width:20px;height:20px;margin:0}.times{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px}.tab{white-space:nowrap;background:#e5e7eb;color:#374151;padding:8px 11px}.tab.active{background:#111827;color:#fff}
.post{display:block;padding:13px 0;border-bottom:1px solid #f1f5f9;color:inherit;text-decoration:none}.post:last-child{border-bottom:0}.board{font-size:11px;color:#6b7280}.title{font-size:15px;font-weight:650;line-height:1.42;margin-top:3px}.date{font-size:11px;color:#9ca3af;margin-top:5px}.empty{color:#9ca3af;font-size:13px;padding:8px 0}
.meal-date{font-size:13px;color:#6b7280;margin:-4px 0 12px}.restaurant{border-top:1px solid #f1f5f9;padding:12px 0}.restaurant:first-child{border-top:0;padding-top:0}.restaurant strong{display:block;margin-bottom:7px}.meal-row{display:grid;grid-template-columns:44px 1fr;gap:8px;font-size:13px;line-height:1.55;margin-top:5px}.meal-label{color:#6b7280;font-weight:700}.meal-setting{display:grid;grid-template-columns:1fr 125px;align-items:center;gap:10px}.meal-setting .check{margin:0}.meal-setting .field{margin:5px 0}
.corner-line+.corner-line{margin-top:5px}.week-day{border-top:1px solid #e5e7eb;padding:14px 0}.week-day:first-child{border-top:0;padding-top:2px}.week-day h3{font-size:15px;margin:0 0 10px}.week-restaurant{background:#f8fafc;border-radius:12px;padding:11px;margin-top:8px}.week-restaurant>strong{font-size:13px}.week-select{margin:0 0 12px}.pdf-update{margin-top:16px;padding-top:14px;border-top:1px solid #e5e7eb}
</style>
</head>
<body><main>
<h1>Portal Notifier</h1>

<section class="card">
  <div class="row"><span id="dot" class="dot"></span><strong id="statusText">연결 전</strong></div>
  <div class="meta">마지막 성공 확인: <span id="lastCheck">-</span></div>
  <div id="lastError" class="error"></div>
  <div class="actions"><button id="check">지금 확인</button></div>
</section>

<section class="card">
  <h2>오늘의 식단</h2>
  <div id="mealDate" class="meal-date"></div>
  <div id="meal"><div class="empty">불러오는 중...</div></div>
</section>

<section class="card">
  <h2>주간 식단</h2>
  <label class="field week-select">조회할 주차<select id="mealWeek"></select></label>
  <div id="weeklyMeal"><div class="empty">불러오는 중...</div></div>
  <div class="pdf-update">
    <label class="field">새 식단표 PDF 링크<input id="mealPdfUrl" type="url" inputmode="url" placeholder="포탈 PDF 링크를 붙여넣으세요"></label>
    <div class="hint">금요일이나 토요일에 새 링크를 등록하면 이전 주 식단은 유지되고 다음 주 식단이 추가됩니다.</div>
    <div class="actions"><button id="refreshMeal" class="secondary">식단표 업데이트</button></div>
  </div>
</section>

<section class="card">
  <h2>최신 게시물</h2>
  <div id="tabs" class="tabs"></div>
  <div id="latest"><div class="empty">불러오는 중...</div></div>
</section>

<section class="card">
  <h2>앱 연결</h2>
  <label class="field">개인 앱 키<input id="clientKey" type="password" autocomplete="off"></label>
  <div class="actions">
    <button id="saveKey" class="secondary">앱 키 저장</button>
    <button id="push">알림 허용</button>
    <button id="test" class="secondary">최신 글 테스트 알림</button>
  </div>
</section>

<section class="card">
  <h2>알림 설정</h2>
  <label class="field">확인 주기
    <select id="interval"><option value="5">5분</option><option value="10">10분</option><option value="15">15분</option><option value="30">30분</option><option value="60">60분</option></select>
  </label>
  <label class="check"><input id="quietEnabled" type="checkbox"><span>방해금지 사용</span></label>
  <div class="times">
    <label class="field">시작<input id="quietStart" type="time"></label>
    <label class="field">종료<input id="quietEnd" type="time"></label>
  </div>
  <div class="hint">식단 알림 시간</div>
  <div id="mealSettings"></div>
  <div class="actions">
    <select id="testMeal" aria-label="테스트할 식사"><option value="breakfast">조식</option><option value="lunch" selected>중식</option><option value="dinner">석식</option></select>
    <button id="mealTest" class="secondary">식단 테스트 알림</button>
  </div>
</section>

<section class="card">
  <h2>알림 받을 게시판</h2>
  <div id="boards"></div>
  <div class="actions"><button id="saveSettings">설정 저장</button></div>
</section>

</main>
<script src="./config.js"></script><script src="./app.js?v=20260810-2"></script>
</body></html>
