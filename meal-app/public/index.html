<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f97316">
  <meta name="description" content="주간 식단을 확인하고 원하는 시간에 알림을 받으세요.">
  <title>오늘의 식단</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main>
    <header class="hero">
      <p class="eyebrow">WEEKLY MEAL</p>
      <h1>오늘의 식단</h1>
      <p>주간 메뉴를 확인하고, 원하는 식사 시간에 알림을 받아보세요.</p>
    </header>

    <section class="card" aria-labelledby="meal-heading">
      <div class="section-heading">
        <div>
          <p class="eyebrow">MENU</p>
          <h2 id="meal-heading">식단표</h2>
        </div>
        <span id="updatedAt" class="badge">불러오는 중</span>
      </div>
      <div id="weekTabs" class="tabs" aria-label="주차 선택"></div>
      <div id="dayTabs" class="days" aria-label="날짜 선택"></div>
      <div id="mealDate" class="meal-date"></div>
      <div id="mealContent" class="meal-content" aria-live="polite">
        <div class="empty">식단을 불러오고 있습니다.</div>
      </div>
    </section>

    <section class="card" aria-labelledby="notification-heading">
      <div class="section-heading">
        <div>
          <p class="eyebrow">NOTIFICATION</p>
          <h2 id="notification-heading">식사 알림</h2>
        </div>
        <span id="notificationState" class="badge muted">연결 안 됨</span>
      </div>

      <label class="field">
        <span>알림 받을 지점</span>
        <select id="restaurant"></select>
      </label>

      <div id="mealSettings" class="meal-settings"></div>

      <p class="hint">알림 시각이 지난 뒤 처음 실행되는 5분 주기에 발송됩니다. 기기나 브라우저 설정에 따라 조금 늦게 도착할 수 있습니다.</p>

      <div class="actions">
        <button id="enableNotifications" type="button">알림 허용</button>
        <button id="saveSettings" type="button" class="secondary">설정 저장</button>
        <button id="testNotification" type="button" class="ghost">테스트 알림</button>
        <button id="disableNotifications" type="button" class="danger ghost">알림 해제</button>
      </div>
      <div id="message" class="message" role="status" aria-live="polite"></div>
    </section>

    <footer>식단 정보만 제공하며 포탈 계정과 게시판 데이터는 저장하지 않습니다.</footer>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
